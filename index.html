<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление терминалом — MyBiBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f0f4f8; 
            background-image: radial-gradient(circle at top right, #e2e8f0 0%, #f0f4f8 100%);
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 1); 
        }
        .step-hidden { display: none; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full space-y-6">
        <div class="text-center mb-2">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 rounded-xl mb-3 shadow-lg shadow-blue-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">MyBiBank Service</h1>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] shadow-2xl shadow-blue-900/5 transition-all">
            
            <div id="step-login" class="space-y-5">
                <div class="text-center mb-6">
                    <h2 class="text-lg font-semibold text-slate-700">Идентификация</h2>
                    <p class="text-slate-400 text-sm">Введите пятизначный номер устройства</p>
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2 ml-1">Terminal ID</label>
                    <input type="text" id="terminalID" maxlength="5" placeholder="00000"
                        class="w-full px-4 py-4 rounded-2xl border border-slate-100 bg-slate-50 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all text-2xl tracking-[0.5em] text-center font-mono font-bold text-slate-700">
                </div>
                <button onclick="goToTerminal()" 
                    class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-4 rounded-2xl transition-all shadow-lg active:scale-[0.98]">
                    Войти в систему
                </button>
            </div>

            <div id="step-dashboard" class="step-hidden space-y-6">
                <div class="flex items-center justify-between p-4 bg-emerald-50 rounded-2xl border border-emerald-100">
                    <div>
                        <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-wider">Статус системы</p>
                        <p class="text-sm font-bold text-emerald-800">Терминал: <span id="display-id">-----</span></p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-xs font-medium text-emerald-600">Online</span>
                        <span class="relative flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                        </span>
                    </div>
                </div>
                
                <div class="py-12 text-center border-2 border-dashed border-slate-100 rounded-[2rem] bg-slate-50/50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-slate-300 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                    </svg>
                    <p class="text-slate-400 text-sm">Ожидание действий</p>
                </div>

                <button onclick="goToPayment()"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-200 transition-all active:scale-[0.98]">
                    Новый платеж
                </button>
            </div>

            <div id="step-payment" class="step-hidden space-y-5">
                <button onclick="backToDashboard()" class="group flex items-center text-slate-400 hover:text-blue-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1 group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    <span class="text-xs font-semibold uppercase tracking-wider">Назад</span>
                </button>

                <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-3 text-center">Сумма платежа (RUB)</label>
                    <input type="number" id="amount" value="3000"
                        class="w-full bg-transparent focus:outline-none text-4xl font-black text-center text-slate-800 placeholder-slate-300">
                </div>

                <button id="btn-accept" onclick="handlePayment()"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-5 rounded-2xl shadow-xl shadow-emerald-200 transition-all flex items-center justify-center overflow-hidden relative">
                    <span id="btn-text" class="relative z-10">ПРИНЯТЬ ОПЛАТУ</span>
                    <div id="loader" class="hidden animate-spin h-6 w-6 border-3 border-white border-t-transparent rounded-full ml-3 relative z-10"></div>
                </button>
            </div>

        </div>

        <div id="status-log" class="text-center text-[10px] text-slate-400 font-mono uppercase tracking-tighter opacity-60"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Ваша конфигурация
        const firebaseConfig = {
            apiKey: "AIzaSyBUtgbz0Pgs86SzCqPxs4nnIKCVzXB8MvI",
            authDomain: "mybibankservice.firebaseapp.com",
            projectId: "mybibankservice",
            storageBucket: "mybibankservice.firebasestorage.app",
            messagingSenderId: "502327590363",
            appId: "1:502327590363:web:67980f205f9dc109bf3bfe",
            measurementId: "G-FXHT9QJ5MV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Интерфейсная логика
        window.goToTerminal = () => {
            const id = document.getElementById('terminalID').value.trim();
            if (id.length === 5) {
                document.getElementById('display-id').innerText = id;
                showStep('step-dashboard');
            } else {
                alert('Пожалуйста, введите корректный 5-значный ID');
            }
        };

        window.goToPayment = () => showStep('step-payment');
        window.backToDashboard = () => showStep('step-dashboard');

        function showStep(stepId) {
            ['step-login', 'step-dashboard', 'step-payment'].forEach(id => {
                document.getElementById(id).classList.add('step-hidden');
            });
            document.getElementById(stepId).classList.remove('step-hidden');
        }

        // Основная функция записи в Firestore
        window.handlePayment = async () => {
            const terminalID = document.getElementById('terminalID').value.trim();
            const amountInput = document.getElementById('amount').value;
            const amount = parseInt(amountInput);
            
            const btn = document.getElementById('btn-accept');
            const btnText = document.getElementById('btn-text');
            const loader = document.getElementById('loader');
            const log = document.getElementById('status-log');

            if (isNaN(amount) || amount <= 0) {
                alert('Введите корректную сумму');
                return;
            }

            // Визуальное состояние загрузки
            btn.disabled = true;
            btnText.innerText = "ОБРАБОТКА...";
            loader.classList.remove('hidden');
            btn.classList.add('opacity-90');

            try {
                // Путь: terminals/{terminalID}
                const ref = doc(db, 'terminals', terminalID);
                
                await setDoc(ref, {
                    status: 'processing',
                    command: 'accept',
                    amount: amount,
                    updatedAt: serverTimestamp()
                }, { merge: true });

                log.innerText = `LAST CMD: ACCEPT | ID: ${terminalID} | SUM: ${amount} | ${new Date().toLocaleTimeString()}`;
                
                // Визуальное подтверждение успеха
                btnText.innerText = "ГОТОВО!";
                btn.classList.replace('bg-emerald-600', 'bg-blue-600');
                loader.classList.add('hidden');
                
                setTimeout(() => {
                    btnText.innerText = "ПРИНЯТЬ ОПЛАТУ";
                    btn.classList.replace('bg-blue-600', 'bg-emerald-600');
                    btn.disabled = false;
                    backToDashboard();
                }, 1500);

            } catch (error) {
                console.error("Ошибка при записи в Firestore:", error);
                alert('Ошибка отправки. Проверьте настройки доступа Firestore.');
                btn.disabled = false;
                btnText.innerText = "ПРИНЯТЬ ОПЛАТУ";
                loader.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
